# Versions of the Android placeholder module. The aliases match CYLSearchViewController's android/merged, which builds
# this module from source at a pinned commit.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
appcompat = "1.7.0"
core-ktx = "1.13.1"
junit = "4.13.2"
robolectric = "4.14.1"
androidx-test-core = "1.6.1"
recyclerview = "1.3.2"
customview = "1.1.0"
swiperefreshlayout = "1.1.0"
material = "1.12.0"
lottie = "6.6.2"
libpag = "4.5.98"
rive = "10.3.0"
svgaplayer = "2.6.1"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
libpag = { module = "com.tencent.tav:libpag", version.ref = "libpag" }
rive = { module = "app.rive:rive-android", version.ref = "rive" }
# SVGAPlayer-Android is only on JitPack (settings.gradle.kts limits that repository to it).
svgaplayer = { module = "com.github.yyued:SVGAPlayer-Android", version.ref = "svgaplayer" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
