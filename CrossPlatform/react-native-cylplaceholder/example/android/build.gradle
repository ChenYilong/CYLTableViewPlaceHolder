buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// [EN] The native components of this repository's android/ (refresh kernel) are published to the local Maven repository
//      first (see README.md), so every module resolves them from there.
// [CN] 本仓库 android/ 的原生组件（刷新内核）先发布到本地 Maven，各模块从那里解析。
allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}
