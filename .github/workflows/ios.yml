# iOS CI on GitHub-hosted macOS runners, modeled on CYLTabBarController's .github/workflows/ios.yml. See docs/CI-CD.md.
# Runner: `macos-26` by default; set the repository variable MACOS_RUNNER (Settings → Secrets and variables → Actions →
# Variables) to use another, e.g. `xcode-27`.
name: iOS

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the macOS jobs need to build. A pull request that only changes docs (docs/, *.md, assets/) skips
  # their steps; the jobs still run and report success, so required checks pass. Pushes and manual runs always build.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Code changed?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(git diff --name-only "$BASE"...HEAD | grep -vE '^(docs/|assets/)|\.md$|\.base$' || true)
          echo "Code files changed:"
          echo "${CODE:-(none)}"
          if [[ -n "$CODE" ]]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  # Every .bundle's tables: same keys and format specifiers in every language, macros match keys, no loose .strings
  # (instructions.md, "Localization"). Runs on every pull request, including documentation-only ones.
  localization:
    name: Localization files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_localizations.py

  # Full `pod lib lint` of every subspec (Core, CYLPlaceholderItemAnimation, LottieSwift, PAG, PAGEnterprise, Rive, GIF).
  lint:
    name: pod lib lint
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: CocoaPods cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-lint-${{ hashFiles('CYLTableViewPlaceHolder.podspec') }}
          restore-keys: pods-${{ runner.os }}-lint-
      - name: Versions
        if: needs.changes.outputs.code == 'true'
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
          pod --version || sudo gem install cocoapods
      - name: pod lib lint
        if: needs.changes.outputs.code == 'true'
        run: scripts/pod-lint.sh lib

  # The framework target Carthage builds, then the static analyzer; a warning in the placeholder's sources fails the job.
  framework:
    name: Framework build and analyze
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and analyze CYLTableViewPlaceHolderFramework
        if: needs.changes.outputs.code == 'true'
        run: scripts/framework-build.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: framework-logs
          path: |
            build/*.log
            build/analyzer
          if-no-files-found: ignore

  # The podspec still declares iOS 12. Xcode 26/27 cannot target it, so build Core at iOS 12.0 with the newest Xcode 16
  # on the macos-15 image, failing on any newer API not guarded by @available. (No hosted runner has an iOS 12
  # simulator: those runtimes are Intel-only.)
  ios12:
    name: iOS 12 deployment build
    needs: changes
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        if: needs.changes.outputs.code == 'true'
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Build at iOS 12.0
        if: needs.changes.outputs.code == 'true'
        run: scripts/ios12-build.sh

  # Tests/run-tests.rb: placeholder, refresh, built-in GIF and the shared animation module on a simulator.
  unit-tests:
    name: Unit tests
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: xcodeproj gem
        if: needs.changes.outputs.code == 'true'
        run: ruby -e 'require "xcodeproj"' || sudo gem install xcodeproj
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: scripts/unit-tests.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: unit-tests-log
          path: build/unit-tests.log
          if-no-files-found: ignore

  # XCUITests that read the accessibility tree VoiceOver reads, plus Apple's accessibility audit (iOS 17+).
  accessibility:
    name: Accessibility
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: xcodeproj gem
        if: needs.changes.outputs.code == 'true'
        run: ruby -e 'require "xcodeproj"' || sudo gem install xcodeproj
      - name: Accessibility tests
        if: needs.changes.outputs.code == 'true'
        run: scripts/accessibility-tests.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: accessibility-log
          path: build/accessibility-tests.log
          if-no-files-found: ignore

  # The optional animation libraries installed with CocoaPods, like CYLTabBarController's animation-tests.yml:
  # static and dynamic frameworks with PAG, and PAGEnterprise. Rive fixtures come from CYLTabBarController master; the
  # PAG fixture is downloaded from Tencent/libpag at a pinned commit and checked by SHA-256.
  animation:
    name: Animation ${{ matrix.linkage }} ${{ matrix.pag }}
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { linkage: static, pag: PAG }
          - { linkage: dynamic, pag: PAG }
          - { linkage: static, pag: PAGEnterprise }
    steps:
      - uses: actions/checkout@v4
      - name: Animation fixtures (CYLTabBarController)
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          repository: ChenYilong/CYLTabBarController
          ref: master
          path: .fixtures/CYLTabBarController
          # The Rive fixtures; the PAG fixture is downloaded by scripts/animation-tests.sh (not kept in git upstream).
          sparse-checkout: |
            Example-SwiftUI-Rive/AnimatedApp/RiveAssets
          sparse-checkout-cone-mode: true
      - name: CocoaPods cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-animation-${{ matrix.pag }}-${{ hashFiles('CYLTableViewPlaceHolder.podspec') }}
          restore-keys: pods-${{ runner.os }}-animation-${{ matrix.pag }}-
      - name: Tools
        if: needs.changes.outputs.code == 'true'
        run: |
          pod --version || sudo gem install cocoapods
          ruby -e 'require "xcodeproj"' || sudo gem install xcodeproj
      - name: Animation tests
        if: needs.changes.outputs.code == 'true'
        env:
          CYL_FIXTURES_ROOT: ${{ github.workspace }}/.fixtures/CYLTabBarController
        run: scripts/animation-tests.sh "${{ matrix.linkage }}" "${{ matrix.pag }}"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: animation-${{ matrix.linkage }}-${{ matrix.pag }}-log
          path: build/animation-tests-*.log
          if-no-files-found: ignore

  # Carthage: the XCFramework a release attaches, built as the Release workflow builds it.
  carthage:
    name: Carthage
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Carthage
        if: needs.changes.outputs.code == 'true'
        run: carthage version || brew install carthage
      - name: XCFramework
        if: needs.changes.outputs.code == 'true'
        run: |
          scripts/pod-lint.sh xcframework
          unzip -l build/CYLTableViewPlaceHolder.xcframework.zip | grep -q "CYLTableViewPlaceHolder.xcframework/Info.plist"
          unzip -l build/CYLTableViewPlaceHolder.xcframework.zip | grep -q "CYLTableViewPlaceHolder.bundle"

  # Every demo, one job each; one failing demo does not stop the others.
  examples:
    name: Demo ${{ matrix.demo }}
    needs: changes
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        demo:
          - .
          - Examples/Example-objc-01
          - Examples/Example-objc-02
          - Examples/Example-SwiftUI
          - Examples/Example-Scenarios
    steps:
      - uses: actions/checkout@v4
      - name: CocoaPods
        if: needs.changes.outputs.code == 'true'
        run: pod --version || sudo gem install cocoapods
      - name: CocoaPods cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-demo-${{ hashFiles('CYLTableViewPlaceHolder.podspec', '**/Podfile', '**/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-demo-
      # Builds, then launches the app on a simulator and saves build/screenshots/<scheme>.png;
      # a build without a screenshot fails (instructions.md, "CI example screenshots").
      - name: Build and screenshot
        if: needs.changes.outputs.code == 'true'
        run: scripts/ci-build-example.sh "${{ matrix.demo }}"
      - name: Artifact name
        id: artifact
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          slug=$(echo "${{ matrix.demo }}" | sed -e 's|^\.$|Example|' -e 's|/|-|g')
          echo "name=example-screenshot-$slug" >> "$GITHUB_OUTPUT"
      - name: Upload screenshot
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/screenshots/*.png
            build/*-uitests.log
          if-no-files-found: warn
      - name: Summary
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          {
            echo "| Demo | Scheme | Build | Warnings | Screenshot |"
            echo "|:---|:---|:---:|---:|:---:|"
            cat build/summary.md 2>/dev/null || echo "| ${{ matrix.demo }} | - | ❌ | - | ❌ |"
            echo
            echo "Screenshot artifact: \`${{ steps.artifact.outputs.name }}\` on the [run page](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  # Shows every demo's screenshot inline: in this job's summary and in one pull request comment updated in place.
  # The images are committed to the `ci-screenshots` branch, one folder per pull request or branch; a fork's
  # read-only token cannot push, so its run only links the artifacts. See docs/CI-CD.md.
  screenshots:
    name: Example screenshots
    needs: [ changes, examples ]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: example-screenshot-*
          merge-multiple: true
          path: build/screenshots
      - name: Publish screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/screenshots
          scripts/ci-publish-screenshots.sh build/screenshots
